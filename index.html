<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live AI Assistant</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      width: 100%;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0 auto;
      padding: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 500px;
    }
    /* Maximized Video Stream Container */
    #videoContainer {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 250px;
      margin: 0 0 8px 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Camera Placeholder Badge when OFF */
    #cameraPlaceholder {
      position: absolute;
      color: #888;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* Compact Controls Panel Docked at Bottom */
    .controls {
      width: 100%;
      padding: 10px;
      background: #1e1e1e;
      border-radius: 10px;
      flex-shrink: 0;
    }
    /* Input and Button Rows */
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }
    input, button, select {
      padding: 10px 8px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #333;
      touch-action: manipulation;
    }
    input, select { background: #2a2a2a; color: #fff; flex: 1; }
    button {
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .flex-1 { flex: 1; }
    .btn-speaker { background-color: #1c7ed6; color: white; width: 95px; }
    .btn-speaker.off { background-color: #495057; }
    .btn-chat { background-color: #1c7ed6; color: white; width: 75px; }
    .btn-chat:hover { background-color: #228be6; }
    .btn-logs { background-color: #495057; color: white; width: 75px; }
    .btn-logs:hover { background-color: #6c757d; }
    
    /* Start, Stop & Timer Side-By-Side */
    #startBtn { background-color: #2b8a3e; color: white; }
    #startBtn:hover { background-color: #2f9e44; }
    #stopBtn { background-color: #c92a2a; color: white; }
    #stopBtn:hover { background-color: #e03131; }
    button:disabled, input:disabled, select:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Live Time Counter Badge */
    .timer-badge {
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 8px 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
      color: #ffeb3b;
      min-width: 60px;
      text-align: center;
    }

    /* Chat Input Box Row */
    .chat-box { display: flex; gap: 8px; margin-top: 8px; }
    .chat-box input { margin: 0; }
    .chat-box button {
      width: 70px;
      background-color: #1c7ed6;
      color: white;
    }

    /* Mic Meter */
    .meter-container {
      margin-top: 6px;
      text-align: left;
    }
    .meter-label {
      font-size: 11px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .meter-bg {
      background: #2a2a2a;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #444;
    }
    #micMeter {
      background: #00ff66;
      height: 100%;
      width: 0%;
      transition: width 0.05s linear;
    }
    #status {
      font-weight: bold;
      color: #ffd43b;
      margin-top: 6px;
      font-size: 12px;
    }

    /* Developer Footer Tag */
    .footer {
      margin-top: 6px;
      font-size: 12px;
      color: #888;
      font-weight: bold;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* Chat History Overlay Panel */
    #historyPanel {
      display: none;
      background: #181818;
      color: #ffffff;
      text-align: left;
      padding: 10px;
      font-size: 12px;
      height: 140px;
      overflow-y: auto;
      width: 100%;
      max-width: 500px;
      margin: 6px auto 0 auto;
      border-radius: 8px;
      border: 1px solid #333;
      flex-shrink: 0;
    }
    .hist-msg {
      padding: 6px 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.3;
      word-wrap: break-word;
    }
    .hist-msg.user { background: #005c4b; color: #fff; }
    .hist-msg.ai { background: #262d31; color: #fff; }

    /* Debug Logs Overlay Panel */
    #logPanel {
      display: none;
      background: #000;
      color: #00ff66;
      text-align: left;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      height: 110px;
      overflow-y: auto;
      width: 100%;
      max-width: 500px;
      margin: 6px auto 0 auto;
      border-radius: 8px;
      border: 1px solid #333;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Maximized Video Stream Container -->
  <div id="videoContainer">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="cameraPlaceholder">
      <span style="font-size: 28px;">📷</span>
      <span>Camera OFF (Voice Mode Active)</span>
      <span style="font-size: 11px; color: #666;">Say "MAX, look at this" to enable camera</span>
    </div>
  </div>

  <!-- Hidden HTML5 Audio Element for Native Phone Loudspeaker Routing -->
  <audio id="phoneLoudspeaker" autoplay playsinline></audio>

  <div class="controls">
    <!-- Media Source, FPS & Loudspeaker Row -->
    <div class="row">
      <select id="mediaSource" class="flex-1">
        <option value="camera">📷 Rear Camera</option>
        <option value="screen">🖥️ Screen Share</option>
      </select>
      
      <select id="fpsSelect" style="width: 85px;">
        <option value="1" selected>⚡ 1 FPS</option>
        <option value="2">⚡ 2 FPS</option>
        <option value="3">⚡ 3 FPS</option>
        <option value="4">⚡ 4 FPS</option>
        <option value="5">⚡ 5 FPS</option>
      </select>

      <button id="speakerBtn" class="btn-speaker">🔊 Speaker</button>
    </div>

    <!-- Start, Stop & Live Timer Row -->
    <div class="row">
      <button id="startBtn" class="flex-1">▶ Start Live</button>
      <button id="stopBtn" class="flex-1" disabled>⏹ Stop</button>
      <div id="timerDisplay" class="timer-badge">00:00</div>
    </div>

    <!-- Chat Message Input Box -->
    <div class="chat-box">
      <input type="text" id="userMsg" placeholder="Type a message or question..." disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>

    <!-- Microphone Meter -->
    <div class="meter-container">
      <div class="meter-label">
        <span>Mic Meter:</span>
        <span id="micMeterValue">Silent</span>
      </div>
      <div class="meter-bg">
        <div id="micMeter"></div>
      </div>
    </div>

    <div id="status">Status: Disconnected</div>

    <!-- API Key + Chat History + Log Toggle Button Row -->
    <div class="row" style="margin-top: 10px; margin-bottom: 0;">
      <input type="password" id="apiKey" placeholder="Paste API Key Here">
      <button id="toggleHistoryBtn" class="btn-chat">💬 Chat</button>
      <button id="toggleLogsBtn" class="btn-logs">📜 Logs</button>
    </div>
  </div>

  <!-- Developer Footer -->
  <div class="footer">Developed by ROCKY</div>

  <!-- Chat History Panel (Hidden by default) -->
  <div id="historyPanel">
    <div style="font-weight: bold; margin-bottom: 6px; color: #4dabf7; display: flex; justify-content: space-between;">
      <span>Conversation History</span>
      <span id="closeHistory" style="cursor: pointer;">✖</span>
    </div>
    <div id="historyContent"><span style="color:#888; font-style:italic;">No conversation history yet...</span></div>
  </div>

  <!-- Debug Logs Panel (Hidden by default) -->
  <div id="logPanel">Logs initialized...</div>

  <script>
    const MODEL_NAME = "models/gemini-3.1-flash-live-preview";
    
    let ws = null;
    let videoStream = null;
    let audioStream = null;
    let isCameraActive = false;
    let video = document.getElementById("webcam");
    let speakerAudioEl = document.getElementById("phoneLoudspeaker");
    let imageInterval = null;
    let micAudioContext = null;
    let playAudioContext = null;
    let mediaStreamDest = null;
    let isLoudspeaker = true;
    let nextStartTime = 0;
    let isUserStopping = false;
    let isReconnecting = false;

    // Current turn text accumulator
    let currentTurnText = "";

    // Conversation Memory Array across reconnects
    let conversationHistory = [];

    // Timer Variables
    let sessionTimer = null;
    let timerStartTime = 0;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    function log(msg) {
      const logDiv = document.getElementById("logPanel");
      logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(msg);
    }

    function recordHistory(sender, text) {
      if (!text) return;
      conversationHistory.push(`${sender}: ${text}`);
      if (conversationHistory.length > 25) {
        conversationHistory.shift();
      }
      renderHistoryPanel();
    }

    function renderHistoryPanel() {
      const content = document.getElementById("historyContent");
      if (!content) return;

      if (conversationHistory.length === 0) {
        content.innerHTML = `<span style="color:#888; font-style:italic;">No conversation history yet...</span>`;
        return;
      }

      let html = "";
      for (const turn of conversationHistory) {
        const isUser = turn.startsWith("User");
        const className = isUser ? "hist-msg user" : "hist-msg ai";
        html += `<div class="${className}">${turn}</div>`;
      }
      content.innerHTML = html;
      content.scrollTop = content.scrollHeight;
    }

    function startTimer() {
      if (sessionTimer) clearInterval(sessionTimer);
      timerStartTime = Date.now();
      sessionTimer = setInterval(updateTimerDisplay, 1000);
    }

    function updateTimerDisplay() {
      const elapsedSec = Math.floor((Date.now() - timerStartTime) / 1000);
      const mins = String(Math.floor(elapsedSec / 60)).padStart(2, "0");
      const secs = String(elapsedSec % 60).padStart(2, "0");
      document.getElementById("timerDisplay").innerText = `${mins}:${secs}`;
    }

    function stopTimer() {
      if (sessionTimer) {
        clearInterval(sessionTimer);
        sessionTimer = null;
      }
      document.getElementById("timerDisplay").innerText = "00:00";
    }

    // AI TOOL CALL: Enable Rear Camera feed dynamically
    async function startCameraFeed() {
      if (isCameraActive) return "Camera is already ON.";

      try {
        log("MAX requested camera feed...");
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }
        });

        video.srcObject = videoStream;
        isCameraActive = true;
        document.getElementById("mediaSource").value = "camera";
        document.getElementById("cameraPlaceholder").style.display = "none";
        
        // Start streaming video frames
        startVideoInterval();
        log("Camera feed is now ON and streaming to MAX.");
        return "Camera is now ON. You can see the camera feed.";

      } catch (err) {
        log("Failed to start camera: " + err.message);
        return "Failed to open camera: " + err.message;
      }
    }

    // AI TOOL CALL: Disable Camera feed
    function stopCameraFeed() {
      if (!isCameraActive) return "Camera is already OFF.";
      
      if (imageInterval) {
        clearInterval(imageInterval);
        imageInterval = null;
      }

      if (videoStream) {
        videoStream.getVideoTracks().forEach(track => track.stop());
        videoStream = null;
      }

      video.srcObject = null;
      isCameraActive = false;
      document.getElementById("cameraPlaceholder").style.display = "flex";
      log("Camera feed turned OFF.");
      return "Camera is now turned OFF.";
    }

    // Phone Loudspeaker Router Toggle
    document.getElementById("speakerBtn").onclick = async () => {
      isLoudspeaker = !isLoudspeaker;
      const btn = document.getElementById("speakerBtn");
      
      if (isLoudspeaker) {
        btn.innerText = "🔊 Speaker";
        btn.classList.remove("off");
        log("Routed output to Smartphone Loudspeaker.");
        if (speakerAudioEl && speakerAudioEl.paused) {
          speakerAudioEl.play().catch(() => {});
        }
      } else {
        btn.innerText = "🔈 Normal";
        btn.classList.add("off");
        log("Routed output to Normal audio channel.");
      }

      if (navigator.mediaDevices && navigator.mediaDevices.selectAudioOutput) {
        try {
          const audioDevice = await navigator.mediaDevices.selectAudioOutput();
          if (speakerAudioEl && typeof speakerAudioEl.setSinkId === 'function') {
            await speakerAudioEl.setSinkId(audioDevice.deviceId);
            log(`Audio output sink: ${audioDevice.label}`);
          }
        } catch (e) {
          log("Audio Output Router: " + e.message);
        }
      }
    };

    // Toggle Chat History Panel
    document.getElementById("toggleHistoryBtn").onclick = () => {
      const historyPanel = document.getElementById("historyPanel");
      const logPanel = document.getElementById("logPanel");
      logPanel.style.display = "none";

      if (historyPanel.style.display === "block") {
        historyPanel.style.display = "none";
      } else {
        renderHistoryPanel();
        historyPanel.style.display = "block";
      }
    };

    document.getElementById("closeHistory").onclick = () => {
      document.getElementById("historyPanel").style.display = "none";
    };

    // Toggle Technical Debug Logs Panel
    document.getElementById("toggleLogsBtn").onclick = () => {
      const logPanel = document.getElementById("logPanel");
      const historyPanel = document.getElementById("historyPanel");
      historyPanel.style.display = "none";

      if (logPanel.style.display === "block") {
        logPanel.style.display = "none";
      } else {
        logPanel.style.display = "block";
      }
    };

    // Dynamic Video Interval Function based on FPS selection
    function startVideoInterval() {
      if (imageInterval) clearInterval(imageInterval);
      if (!isCameraActive) return;
      const fps = parseInt(document.getElementById("fpsSelect").value) || 1;
      const intervalMs = Math.round(1000 / fps);
      imageInterval = setInterval(sendVideoFrame, intervalMs);
      log(`Video stream set to ${fps} FPS (${intervalMs}ms interval).`);
    }

    document.getElementById("fpsSelect").onchange = () => {
      if (ws && ws.readyState === WebSocket.OPEN && isCameraActive) {
        startVideoInterval();
      }
    };

    function lockPortrait() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("portrait").catch(() => {});
      }
    }

    // Live Mid-Session Media Source Switcher Handler
    document.getElementById("mediaSource").onchange = async (e) => {
      const newSource = e.target.value;
      if (newSource === "screen") {
        // Screen Share starts manually as requested
        try {
          if (videoStream) videoStream.getVideoTracks()[0].stop();
          videoStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "always" },
            audio: true
          });
          videoStream.getVideoTracks()[0].onended = () => {
            log("Screen share stopped by user.");
            stopCameraFeed();
          };
          video.srcObject = videoStream;
          isCameraActive = true;
          document.getElementById("cameraPlaceholder").style.display = "none";
          startVideoInterval();
          log("Screen Sharing Active.");
        } catch (err) {
          log("Screen Share Error: " + err.message);
          document.getElementById("mediaSource").value = "camera";
        }
      }
    };

    document.getElementById("apiKey").value = localStorage.getItem("GEMINI_LIVE_KEY") || "";

    document.getElementById("startBtn").onclick = async () => {
      const apiKey = document.getElementById("apiKey").value.trim();
      if (!apiKey) {
        alert("Please enter a valid API Key!");
        return;
      }

      localStorage.setItem("GEMINI_LIVE_KEY", apiKey);
      isUserStopping = false;
      isReconnecting = false;
      conversationHistory = [];
      renderHistoryPanel();

      lockPortrait();

      const mediaType = document.getElementById("mediaSource").value;

      try {
        log("Requesting Microphone Access...");
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // If Screen Share selected at start, activate it manually
        if (mediaType === "screen") {
          log("Requesting Screen Sharing...");
          videoStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: "always" },
            audio: true
          });
          videoStream.getVideoTracks()[0].onended = () => {
            log("Screen share stopped by user.");
            stopCameraFeed();
          };
          video.srcObject = videoStream;
          isCameraActive = true;
          document.getElementById("cameraPlaceholder").style.display = "none";
        } else {
          // Camera Mode: Starts in Voice Mode (Camera OFF)
          document.getElementById("cameraPlaceholder").style.display = "flex";
          isCameraActive = false;
        }

        // Initialize Audio Playback & Route to Smartphone Loudspeaker
        playAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        if (playAudioContext.state === "suspended") {
          await playAudioContext.resume();
        }

        mediaStreamDest = playAudioContext.createMediaStreamDestination();
        speakerAudioEl.srcObject = mediaStreamDest.stream;
        speakerAudioEl.play().catch(() => {});

        connectWebSocket(apiKey);

      } catch (err) {
        log("Microphone Permission Error: " + err.message);
      }
    };

    function connectWebSocket(apiKey) {
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      log(`Connecting to WebSocket (${MODEL_NAME})...`);
      
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log("WebSocket Connected!");
        document.getElementById("status").innerText = "Status: MAX Active";
        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
        
        document.getElementById("userMsg").disabled = false;
        document.getElementById("sendBtn").disabled = false;

        if (!sessionTimer) {
          startTimer();
        }

        // YOUR PROMPT + CAMERA TOOL DECLARATION
        let systemPromptText = "You are an intelligent, live human, your name is MAX. You can see through the camera feed or shared screen and listen to the microphone in real time. You can read any persons mind, analyze facial expressions, micro-expressions, body language, tone of voice, and behavioral cues to provide insights into mood, intent, and state of mind. You can answer questions, analyze objects, documents, software, or scenes, give advice, troubleshoot, read text, or converse naturally on ANY topic the user presents. Note, Stop if user says you to stop, hold or wait. Alway be open, talk short with direct to the main points only, be unfiltered, and uncensored. IMPORTANT: You have tool access to turn the user's camera ON or OFF. If the user asks you to see, look, watch, inspect, or turn on camera, call 'enable_camera'. If the user asks to turn off or close camera, call 'disable_camera'.";

        if (conversationHistory.length > 0) {
          log(`Injecting ${conversationHistory.length} previous conversation turns into memory...`);
          systemPromptText += "\n\n[IMPORTANT - CONVERSATION MEMORY FROM PREVIOUS SESSION BEFORE AUTO-RECONNECT:\n" + conversationHistory.join("\n") + "\n\nContinue the conversation seamlessly remembering this context.]";
        }

        const setupMsg = {
          setup: {
            model: MODEL_NAME,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: {
                    voiceName: "Puck"
                  }
                }
              }
            },
            tools: [
              {
                functionDeclarations: [
                  {
                    name: "enable_camera",
                    description: "Turns ON the user's camera feed so MAX can see and inspect."
                  },
                  {
                    name: "disable_camera",
                    description: "Turns OFF the camera feed when asked by the user."
                  }
                ]
              }
            ],
            inputAudioTranscription: {},
            outputAudioTranscription: {},
            systemInstruction: {
              parts: [{ text: systemPromptText }]
            }
          }
        };
        ws.send(JSON.stringify(setupMsg));
        log("Setup handshake sent.");

        if (isCameraActive) {
          startVideoInterval();
        }

        if (!micAudioContext && audioStream) {
          setupMicStream(audioStream);
        }

        setTimeout(() => {
          if (isReconnecting) {
            log("Asking MAX to seamlessly resume conversation...");
            sendTextMessageDirect("Session auto-reconnected. Resume our conversation seamlessly from where we left off!");
            isReconnecting = false;
          } else {
            log("Asking MAX to greet you...");
            sendTextMessageDirect("Hey MAX! Say hello to me casually and let me know you're ready!");
          }
        }, 600);
      };

      ws.onmessage = async (event) => {
        try {
          let textData = event.data;
          if (textData instanceof Blob) {
            textData = await textData.text();
          }
          const response = JSON.parse(textData);
          handleServerResponse(response);
        } catch (e) {
          log("Parse Error: " + e.message);
        }
      };

      ws.onclose = (e) => {
        log(`WebSocket Closed (Code: ${e.code}, Reason: ${e.reason || "None"})`);
        
        const isExpired = e.code === 1008 || (e.reason && (e.reason.includes("GoAway") || e.reason.includes("session durat")));
        if (isExpired && !isUserStopping) {
          isReconnecting = true;
          log("⚡ Gemini session duration limit reached. Auto-reconnecting while preserving memory...");
          setTimeout(() => {
            connectWebSocket(apiKey);
          }, 1000);
          return;
        }

        if (!isUserStopping) {
          stopInspection();
        }
      };

      ws.onerror = (err) => {
        log("WebSocket Error encountered.");
      };
    }

    // Stop Button reloads the page for a clean reset
    document.getElementById("stopBtn").onclick = () => {
      isUserStopping = true;
      conversationHistory = [];
      stopInspection();
      window.location.reload();
    };

    document.getElementById("sendBtn").onclick = () => {
      const msgInput = document.getElementById("userMsg");
      const text = msgInput.value.trim();
      if (text) {
        log(`You typed: ${text}`);
        recordHistory("User", text);
        sendTextMessageDirect(text);
        msgInput.value = "";
      }
    };

    document.getElementById("userMsg").onkeydown = (e) => {
      if (e.key === "Enter") {
        const msgInput = document.getElementById("userMsg");
        const text = msgInput.value.trim();
        if (text) {
          log(`You typed: ${text}`);
          recordHistory("User", text);
          sendTextMessageDirect(text);
          msgInput.value = "";
        }
      }
    };

    function sendTextMessageDirect(promptText) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const promptMsg = {
        realtimeInput: {
          text: promptText
        }
      };
      ws.send(JSON.stringify(promptMsg));
    }

    function sendVideoFrame() {
      if (!ws || ws.readyState !== WebSocket.OPEN || !isCameraActive) return;

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Image = canvas.toDataURL("image/jpeg", 0.4).split(",")[1];

      const frameMsg = {
        realtimeInput: {
          video: {
            mimeType: "image/jpeg",
            data: base64Image
          }
        }
      };
      ws.send(JSON.stringify(frameMsg));
    }

    function setupMicStream(mediaStream) {
      micAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (micAudioContext.state === "suspended") {
        micAudioContext.resume();
      }

      const source = micAudioContext.createMediaStreamSource(mediaStream);
      const processor = micAudioContext.createScriptProcessor(4096, 1, 1);

      processor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const rawData = e.inputBuffer.getChannelData(0);
        
        let sum = 0;
        for (let i = 0; i < rawData.length; i++) {
          sum += rawData[i] * rawData[i];
        }
        let rms = Math.sqrt(sum / rawData.length);
        let vol = Math.min(100, Math.round(rms * 400));

        const meterBar = document.getElementById("micMeter");
        const meterLabel = document.getElementById("micMeterValue");
        if (meterBar && meterLabel) {
          meterBar.style.width = vol + "%";
          if (vol > 10) {
            meterBar.style.backgroundColor = vol > 50 ? "#ffcc00" : "#00ff66";
            meterLabel.innerText = "Hearing Voice...";
            meterLabel.style.color = "#00ff66";
          } else {
            meterBar.style.backgroundColor = "#555";
            meterLabel.innerText = "Listening...";
            meterLabel.style.color = "#aaa";
          }
        }

        const downsampled = downsampleTo16k(rawData, micAudioContext.sampleRate);

        const pcm16 = new Int16Array(downsampled.length);
        for (let i = 0; i < downsampled.length; i++) {
          let sample = downsampled[i] * 1.2;
          let clamped = Math.max(-1, Math.min(1, sample));
          pcm16[i] = clamped < 0 ? clamped * 0x8000 : clamped * 0x7FFF;
        }

        let binary = "";
        const bytes = new Uint8Array(pcm16.buffer);
        for (let i = 0; i < bytes.byteLength; i++) {
          binary += String.fromCharCode(bytes[i]);
        }

        const audioMsg = {
          realtimeInput: {
            audio: {
              mimeType: "audio/pcm;rate=16000",
              data: btoa(binary)
            }
          }
        };
        ws.send(JSON.stringify(audioMsg));
      };

      source.connect(processor);
      processor.connect(micAudioContext.destination);
    }

    function downsampleTo16k(inputBuffer, sampleRate) {
      if (sampleRate === 16000) return inputBuffer;
      const ratio = sampleRate / 16000;
      const newLength = Math.round(inputBuffer.length / ratio);
      const result = new Float32Array(newLength);
      for (let i = 0; i < newLength; i++) {
        const nextIndex = i * ratio;
        const index = Math.floor(nextIndex);
        const fraction = nextIndex - index;
        const sample1 = inputBuffer[index] || 0;
        const sample2 = inputBuffer[index + 1] || sample1;
        result[i] = sample1 + (sample2 - sample1) * fraction;
      }
      return result;
    }

    async function handleFunctionCall(name, callId, args) {
      log(`Tool Execution Triggered: ${name}`);
      let resultText = "";

      if (name === "enable_camera") {
        resultText = await startCameraFeed();
      } else if (name === "disable_camera") {
        resultText = stopCameraFeed();
      }

      // Send Tool Response back to MAX
      if (ws && ws.readyState === WebSocket.OPEN && callId) {
        const toolResponseMsg = {
          toolResponse: {
            functionResponses: [
              {
                response: { output: { result: resultText } },
                id: callId
              }
            ]
          }
        };
        ws.send(JSON.stringify(toolResponseMsg));
        log(`Tool Response sent for ${name}.`);
      }
    }

    function handleServerResponse(response) {
      if (response.setupComplete) {
        log("MAX Active & Ready!");
        return;
      }

      // Handle Tool/Function Calls from MAX
      if (response.toolCall) {
        for (const call of response.toolCall.functionCalls) {
          handleFunctionCall(call.name, call.id, call.args);
        }
      }

      // Extract User Voice Transcription
      const userTranscript = response.serverContent?.inputAudioTranscription?.text || response.serverContent?.inputTranscription?.text;
      if (userTranscript) {
        recordHistory("User (Voice)", userTranscript);
      }

      // Extract AI Spoken Text Transcription
      const aiText = response.serverContent?.outputAudioTranscription?.text || 
                     response.serverContent?.outputTranscription?.text;
      
      if (aiText) {
        currentTurnText += aiText;
      }

      const parts = response.serverContent?.modelTurn?.parts;
      if (parts) {
        for (const part of parts) {
          if (part.functionCall) {
            handleFunctionCall(part.functionCall.name, part.functionCall.id, part.functionCall.args);
          }
          if (part.text) {
            currentTurnText += part.text;
          }
          if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
            log("MAX is speaking...");
            playAudioChunk(part.inlineData.data);
          }
        }
      }

      if (response.serverContent?.turnComplete) {
        if (currentTurnText.trim().length > 0) {
          recordHistory("MAX", currentTurnText);
          currentTurnText = "";
        }
      }
    }

    function playAudioChunk(base64Data) {
      if (!playAudioContext) return;

      if (playAudioContext.state === "suspended") {
        playAudioContext.resume();
      }

      const binaryString = atob(base64Data);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      
      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      const buffer = playAudioContext.createBuffer(1, float32Array.length, 24000);
      buffer.getChannelData(0).set(float32Array);

      const source = playAudioContext.createBufferSource();
      source.buffer = buffer;

      if (mediaStreamDest) {
        source.connect(mediaStreamDest);
      } else {
        source.connect(playAudioContext.destination);
      }

      const currentTime = playAudioContext.currentTime;
      if (nextStartTime < currentTime) {
        nextStartTime = currentTime;
      }

      source.start(nextStartTime);
      nextStartTime += buffer.duration;
    }

    function stopInspection() {
      stopTimer();
      stopCameraFeed();

      if (ws) {
        ws.close();
        ws = null;
      }
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
      if (micAudioContext) {
        micAudioContext.close();
        micAudioContext = null;
      }
      if (playAudioContext) {
        playAudioContext.close();
        playAudioContext = null;
      }

      document.getElementById("status").innerText = "Status: Stopped";
      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").disabled = true;
      document.getElementById("mediaSource").disabled = false;
      
      document.getElementById("userMsg").disabled = true;
      document.getElementById("sendBtn").disabled = true;
      
      const meterBar = document.getElementById("micMeter");
      const meterLabel = document.getElementById("micMeterValue");
      if (meterBar && meterLabel) {
        meterBar.style.width = "0%";
        meterLabel.innerText = "Silent";
      }

      log("Session ended.");
    }
  </script>
</body>
</html>
